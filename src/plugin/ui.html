<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local Codex Figma Bridge</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #1f2937;
        background: #ffffff;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 16px;
        line-height: 1.3;
      }

      p {
        margin: 0;
        font-size: 12px;
        line-height: 1.5;
        color: #4b5563;
      }

      label {
        display: block;
        margin-top: 12px;
        font-size: 12px;
        color: #374151;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        margin-top: 4px;
        padding: 8px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 12px;
      }

      button {
        width: 100%;
        margin-top: 12px;
        padding: 8px 10px;
        border: 0;
        border-radius: 6px;
        color: #ffffff;
        background: #2563eb;
        font-size: 12px;
        cursor: pointer;
      }

      .status {
        margin-top: 16px;
        padding: 10px 12px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Local Codex Figma Bridge</h1>
    <p>Connect this open Figma file to the local Codex MCP bridge.</p>
    <label>
      Server URL
      <input id="server-url" value="ws://localhost:3846/figma" />
    </label>
    <label>
      Session ID
      <input id="session-id" placeholder="ses_..." />
    </label>
    <label>
      Pairing Token
      <input id="pairing-token" placeholder="000000" />
    </label>
    <button id="connect">Connect</button>
    <div id="status" class="status">Not connected</div>
    <script src="./ui.js"></script>
  </body>
</html>
